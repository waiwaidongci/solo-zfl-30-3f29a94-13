<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>铭文转录与校勘台（离线）</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>铭文转录与校勘台</h1>
      <span class="sub">水下考古 · 离线工作站 · 字位按 Unicode 字素簇计数 · 锚定随字符迁移</span>
    </div>
    <div class="top-actions">
      <select id="docSelect" title="切换抄本"></select>
      <button id="addSurfaceBtn" class="btn">新版面</button>
      <button id="addLineBtn" class="btn">新行</button>
      <button id="importBtn" class="btn ghost" title="导入 JSON 工作区">导入</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button id="exportBtn" class="btn ghost" title="导出 JSON 工作区">导出</button>
      <button id="resetBtn" class="btn ghost" title="恢复示例工作区">示例</button>
    </div>
  </header>

  <main class="layout">
    <section class="canvas-wrap">
      <div class="canvas-head">
        <div id="surfaceTabs" class="surface-tabs"></div>
        <div class="canvas-tools">
          <label class="inline">版面方向
            <select id="modeSelect"></select>
          </label>
          <button id="prependSlotBtn" class="btn mini" title="在当前行首插入字位">行首加字</button>
          <button id="appendSlotBtn" class="btn mini" title="在当前行尾追加字位">行尾加字</button>
        </div>
      </div>
      <div id="transcription" class="transcription" data-testid="transcription"></div>
      <div class="legend">
        <span><i class="sw sw-ligature"></i>合文</span>
        <span><i class="sw sw-missing"></i>缺字占位</span>
        <span><i class="sw sw-defect"></i>缺损</span>
        <span><i class="sw sw-anchor"></i>批注锚点</span>
        <span id="graphemeCounter" class="counter" data-testid="graphemeCounter"></span>
      </div>
    </section>

    <aside class="side">
      <nav class="tabs" id="sideTabs">
        <button data-tab="inspector" class="tab active">字位</button>
        <button data-tab="annotations" class="tab">批注·对应</button>
        <button data-tab="collate" class="tab">逐字校勘</button>
        <button data-tab="glyph" class="tab">字形索引</button>
        <button data-tab="issues" class="tab">校验 <b id="issueBadge" class="badge hidden">0</b></button>
      </nav>

      <div class="panels">
        <section data-panel="inspector" class="panel active" id="panelInspector"></section>
        <section data-panel="annotations" class="panel" id="panelAnnotations"></section>
        <section data-panel="collate" class="panel" id="panelCollate"></section>
        <section data-panel="glyph" class="panel" id="panelGlyph"></section>
        <section data-panel="issues" class="panel" id="panelIssues"></section>
      </div>
    </aside>
  </main>

  <script type="module" src="src/ui/app.mjs"></script>
</body>
</html>
